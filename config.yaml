# ============================================================
#  단백질 설계 · 계산생물학 Job Watcher 설정
#  API 키는 여기에 쓰지 말고 GitHub Secrets에 넣으세요.
# ============================================================

# 검색어 (각 API에 이 문구로 검색)
search_queries:
  - "computational biology"
  - "protein design"
  - "protein engineering"
  - "machine learning drug discovery"
  - "bioinformatics scientist"
  - "computational chemistry"

# 공고 "제목"에 아래 패턴 중 하나라도 있어야 통과 (정규식, 대소문자 무시)
title_include_patterns:
  - 'protein\s*(design|engineer|science|scientist|modeling|structure)'
  - '\bprotein\b.*\b(design|engineer|scientist|discovery|ml|ai)\b'
  - 'computational\s*(biolog|chem|structural|scien|protein|design|drug)'
  - '\bbioinformatic'
  - 'structural\s*biolog|cryo-?em'
  - 'machine learning.*\b(bio|protein|drug|molecul|chem|genom|therapeut)'
  - '\b(ai|ml)\b.*\b(drug|protein|bio|molecul|therapeut|discovery)'
  - 'drug discovery.*\b(computational|ai|ml|machine|data)'
  - 'cheminformatic'
  - 'molecular\s*(dynamics|modeling|simulation|design)'
  - 'biophysic'
  - 'antibody\s*(design|engineer|discovery)'
  - 'enzyme\s*(design|engineer)'
  - 'de novo (protein|design)'
  - 'generative.*\b(bio|protein|molecul|chem)'
  - 'computational scientist'
  - '(scientist|engineer).*\bstructure[- ]based'

# 제목에 아래가 있으면 제외
title_exclude_patterns:
  - '\bsales\b|\baccount executive\b'
  - '\brecruiter\b|talent acquisition'
  - '\bintern\b|\binternship\b'
  - '\btechnician\b'
  - 'manufacturing|\bQC\b|quality control'
  - 'field application|\bsupport specialist\b'
  - 'clinical (trial|research) (coordinator|associate)'

# 본문에 이런 문구가 있으면 "🔐 클리어런스/시민권" 표시
clearance_patterns:
  - 'security clearance'
  - 'U\.?S\.? citizenship (is )?required'
  - 'must be a U\.?S\.? citizen'
hide_clearance_jobs: false

# true면 robots.txt로 자동 수집을 막아둔 회사 사이트는 읽지 않음
respect_robots_txt: false
# 같은 회사 사이트에 요청을 보내는 간격(초)
company_request_delay: 3.0

# 평소 실행: 최근 며칠 이내 새 공고만 확인
max_days_old: 3
# 첫 실행(백필): 현재 올라와 있는 공고를 최근 며칠치까지 여러 페이지 가져옴
# 다시 받고 싶으면 data/state.json 을 삭제하세요
backfill_days: 30
backfill_pages: 4

# 원격 근무 공고도 포함할지 (계산 분야는 원격이 많아 켜둠)
include_remote: true

