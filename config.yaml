# ------------------------------------------------------------
# 데이터 소스
# ------------------------------------------------------------
sources:
  # JSearch: LinkedIn, Indeed, Glassdoor 등
  # RF 사이트와 키를 나눠 쓰므로 이틀에 한 번, 검색어 1개 (월 약 62회)
  jsearch:
    enabled: true
    run_every_days: 2
    queries_per_day: 1
    rotating_queries:
      - "protein design"
      - "computational biology"
      - "machine learning drug discovery"
      - "bioinformatics"
      - "protein engineering"
      - "computational chemistry"

  # Adzuna: 무료 API
  adzuna:
    enabled: true
    company_sweep: true

  # USAJOBS: NIH, NCI, FDA 등 연방 연구직
  usajobs:
    enabled: true
    metros: ["Washington DC", "Boston", "SF Bay Area", "San Diego"]

  # 회사 채용 페이지 직접 연결은 companies.yaml 에서 관리합니다
